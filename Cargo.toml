[package]
name = "dot-tui"
version = "0.8.2"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/cfngc4594/dot-tui"
license = "Apache-2.0"
description = "Experimental native single-conversation terminal client for ChatGPT dot"

[features]
default = []
dev-demo = []

[dependencies]
tracing = { version = "0.1", default-features = false, features = ["std"] }
ratatui-core = "0.1"
tui-scrollbar = "0.2"
chrono = "0.4"
anstyle = "1.0"
textwrap = "0.16"
unicode-segmentation = "1.12.0"
xai-ratatui-textarea = { path = "vendor/xai-ratatui-textarea" }
xai-grok-markdown = { path = "vendor/xai-grok-markdown" }
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
base64 = "0.22"
regex = "1"
xai-grok-image = { path = "vendor/xai-grok-image" }

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
crossterm = { path = "vendor/crossterm" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.3"
parking_lot = "0.12.4"
