name: Build and release

'on':
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Optional build-only rerun. Publishing requires a version-tag push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    outputs:
      commit: ${{ steps.validate.outputs.commit }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a matching version on main
        id: validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 run --manifest-path tools/xtask/Cargo.toml --locked -- check-release-tag "$RELEASE_TAG"

  build:
    needs: [validate-tag]
    if: ${{ !cancelled() && (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install declared build toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup override set 1.89.0
      - name: Parse shell installer
        run: sh -n install.sh
      - name: Parse PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | Write-Error; exit 1 }
      - name: Test Windows installer security boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/test_windows_installer.ps1
      - name: Test app on native host
        run: cargo test --locked
      - name: Test release tooling
        run: cargo test --manifest-path tools/xtask/Cargo.toml --locked
      - name: Build native bundle without running the app or installer
        run: cargo run --manifest-path tools/xtask/Cargo.toml --locked -- build-release --target '${{ matrix.target }}' --output dist/bundle
      - name: Verify Unix installer in an isolated home using only local bundle
        if: runner.os != 'Windows'
        run: |
          set -eu
          BUNDLE=$(find "$PWD/dist" -name SHA256SUMS -print -quit)
          export DOT_TUI_TEST_BUNDLE=$(dirname "$BUNDLE")
          TEST_ROOT=$(mktemp -d)
          trap 'rm -rf "$TEST_ROOT"' EXIT
          mkdir "$TEST_ROOT/mock" "$TEST_ROOT/home"
          cat > "$TEST_ROOT/mock/curl" <<'SH'
          #!/bin/sh
          set -eu
          out=
          while [ "$#" -gt 0 ]; do
            case "$1" in --output) shift; out=$1 ;; esac
            url=$1; shift
          done
          [ -n "$out" ]
          name=${url##*/}
          case "$name" in SHA256SUMS|*.tar.gz) ;; *) exit 1 ;; esac
          cp "$DOT_TUI_TEST_BUNDLE/$name" "$out"
          SH
          chmod +x "$TEST_ROOT/mock/curl"
          HOME="$TEST_ROOT/home" PATH="$TEST_ROOT/mock:$PATH" sh install.sh
          "$TEST_ROOT/home/.local/bin/dot-tui" --version
      - name: Verify Windows installer in a temporary directory using only local bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = (Get-ChildItem dist -Recurse -Filter SHA256SUMS | Select-Object -First 1).Directory.FullName
          $env:DOT_TUI_TEST_BUNDLE = $bundle
          function global:curl.exe {
            $out = $null
            for ($i = 0; $i -lt $args.Count; $i++) { if ($args[$i] -eq '--output') { $out = $args[$i+1] } }
            $name = [IO.Path]::GetFileName([string]$args[-1])
            if (!$out -or ($name -ne 'SHA256SUMS' -and !$name.EndsWith('.tar.gz'))) { throw 'Unexpected test download' }
            Copy-Item -LiteralPath (Join-Path $env:DOT_TUI_TEST_BUNDLE $name) -Destination $out
            $global:LASTEXITCODE = 0
          }
          $testDir = Join-Path $env:USERPROFILE ('dot-tui-install-test-' + [Guid]::NewGuid().ToString('N'))
          try {
            & ./install.ps1 -InstallDir $testDir
            & (Join-Path $testDir 'dot-tui.exe') --version
            if ($LASTEXITCODE -ne 0) { throw 'Binary smoke test failed' }
          } finally {
            Remove-Item -LiteralPath $testDir -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item Function:\curl.exe
          }
      - name: Retain prepared bundle for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dot-tui-${{ matrix.target }}
          path: dist/bundle/
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dot-tui-*
          path: artifacts
      - name: Verify all five bundles and combine release assets
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 run --manifest-path tools/xtask/Cargo.toml --locked -- assemble-release artifacts release
          (cd release && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate-tag, assemble]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job can write. It does not check out or execute repository code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: release
      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ needs.validate-tag.outputs.commit }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS)
          verify_tag() {
            actual_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
            if [ "$actual_commit" != "$EXPECTED_COMMIT" ]; then
              echo "Release tag moved after validation; refusing to publish." >&2
              exit 1
            fi
          }
          verify_tag
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > existing-release; then
            if [ "$(cat existing-release)" != true ]; then
              echo "Refusing to overwrite an already published release." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "dot-tui ${RELEASE_TAG#v}" --generate-notes
          fi
          for asset in release/*; do basename "$asset"; done | LC_ALL=C sort > expected-assets
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort > existing-assets
          if [ -n "$(LC_ALL=C comm -13 expected-assets existing-assets)" ]; then
            echo "Draft has unexpected assets; refusing to publish it." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort > uploaded-assets
          diff -u expected-assets uploaded-assets
          verify_tag
          gh release edit "$RELEASE_TAG" --draft=false
